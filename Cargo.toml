[workspace]
# Resolver 2 prevents features from leaking between independent crates and keeps each
# domain buildable with its explicitly declared dependency set.
resolver = "2"
# The order groups the executable, shared infrastructure, TUI, and domains;
# adding a crate here makes it part of full-workspace validation.
members = [
  "crates/argvus-control-center",
  "crates/argvus-control-center-settings",
  "crates/argvus-control-center-apps",
  "crates/argvus-control-center-core",
  "crates/argvus-control-center-hardware",
  "crates/argvus-control-center-services",
  "crates/argvus-control-center-network",
  "crates/argvus-control-center-audio",
  "crates/argvus-control-center-bluetooth",
  "crates/argvus-control-center-boot",
  "crates/argvus-control-center-packages",
  "crates/argvus-control-center-storage",
  "crates/argvus-control-center-diagnostics",
  "crates/argvus-control-center-power",
  "crates/argvus-control-center-session",
  "crates/argvus-control-center-displays",
  "crates/argvus-control-center-appearance",
  "crates/argvus-about",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
authors = ["ARGVUS"]
repository = "https://github.com/argvus/argvus-control-center"
homepage = "https://github.com/argvus/argvus-control-center"
description = "Keyboard-first terminal control center for the ARGVUS desktop"

[workspace.dependencies]
# Common dependencies are centralized so versions and features remain
# compatible across the crates that compose the Control Center.
anyhow = "1.0"
crossterm = "0.29"
image = { version = "0.25", default-features = false }
rayon = "1"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm", "image-defaults"] }
resvg = { version = "0.48", default-features = false, features = ["text"] }
thiserror = "2.0"
toml = "0.8"
unicode-width = "0.2"
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
argvus-i18n = { package = "argvus-i18n-core", path = "../argvus-i18n/crates/core" }

[profile.release]
# LTO reduces the final executable size; strip avoids shipping debug symbols in the
# distributed package. Development builds remain incremental.
lto = true
strip = true
